# ══════════════════════════════════════════════════════════════════════════════
# Lanework — Docker Compose (app + PostgreSQL)
# Usage:
#   docker compose up -d
# ══════════════════════════════════════════════════════════════════════════════

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lanework
      POSTGRES_USER: lanework
      POSTGRES_PASSWORD: lanework_secret_change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanework"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://lanework:lanework_secret_change_me@db:5432/lanework?sslmode=require
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy

  # Optional: Run Prisma migrations on startup
  migrate:
    build: .
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://lanework:lanework_secret_change_me@db:5432/lanework?sslmode=require
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
